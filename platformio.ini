[platformio]
default_envs = theremin

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:theremin]
build_src_filter = +<*> -<teste/>

[env:test_hcsr04]
build_src_filter = +<teste/test_hcsr04.cpp>

[env:test_buzzer]
build_src_filter = +<teste/test_buzzer.cpp>

[env:test_lcd]
build_src_filter = +<teste/test_lcd.cpp>

[env:test_dac]
build_src_filter = +<teste/test_dac.cpp>

[env:test_sunet]
build_src_filter = +<teste/test_sunet.cpp>

[env:test_zgomot]
build_src_filter = +<teste/test_zgomot.cpp>

[env:test_encoder]
build_src_filter = +<teste/test_encoder.cpp>

[env:test_bc338]
build_src_filter = +<teste/test_bc338.cpp>
